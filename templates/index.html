{% extends "layout.html" %}
{% block content %}

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Live SecureCam Monitor</h4>
    <div class="d-flex align-items-center gap-2">
      <button id="btnStart" class="btn btn-success btn-sm">Start ESP32-Cam</button>
      <button id="btnStop" class="btn btn-danger btn-sm" disabled>Stop</button>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
      <span>Live Feed</span>
      <span id="statusText" class="badge bg-secondary">Status: Unknown</span>
    </div>

    <div class="card-body text-center bg-black p-2">
      <img id="liveImg"
           src=""
           alt="Live feed"
           style="max-width:100%; height:auto; border-radius:10px; border:2px solid #222; background:#000;">
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/home.js') }}"></script>

{% endblock %}
