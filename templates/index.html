{% extends "layout.html" %}
{% block content %}
<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4>Live Monitor</h4>
    <div>
      <button id="btnStart" class="btn btn-success btn-sm">Start Capture</button>
      <button id="btnStop" class="btn btn-danger btn-sm ms-2">Stop Capture</button>
    </div>
  </div>

  <div class="card">
    <div class="card-body text-center">
      <img id="liveImg" src="/api/camera/video_feed" alt="Live feed" style="max-width:100%; height:auto; border:1px solid #ddd;"/>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}
