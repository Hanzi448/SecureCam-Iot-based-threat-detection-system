{% extends "layout.html" %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    <div class="card p-3">
      <h5 class="mb-3">Add Criminal to Watchlist</h5>
      <form id="criminalForm">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input name="name" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Images (1-3)</label>
          <input name="images" id="images" type="file" accept="image/*" multiple class="form-control" required>
        </div>
        <div id="preview" class="mb-3"></div>
        <button class="btn btn-primary" type="submit">Upload & Enroll</button>
      </form>
      <div id="status" class="mt-3"></div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card p-3">
      <h6>Instructions</h6>
      <ul>
        <li>Use clear frontal face photos for better embeddings.</li>
        <li>You can upload multiple images to average embedding.</li>
        <li>After upload, check Watchlist to see the entry.</li>
      </ul>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/add_criminal.js') }}"></script>
{% endblock %}
